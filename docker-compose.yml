version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: eduintelli-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: eduintelli_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduintelli-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      POSTGRES_URL: postgresql://postgres:postgrespassword@postgres:5432/eduintelli_db
      JWT_SECRET: eduintelli_prod_jwt_secret_key_2025
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduintelli-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
